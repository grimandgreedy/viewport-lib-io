[package]
name = "viewport-lib-io"
version = "0.7.0"
edition = "2024"
description = "File format loaders and exporters for viewport-lib"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib-io"
homepage = "https://github.com/grimandgreedy/viewport-lib-io"
documentation = "https://docs.rs/viewport-lib-io"
keywords = ["3d", "loader", "visualization", "viewport", "viewport-lib"]
categories = ["graphics", "parser-implementations", "filesystem"]
rust-version = "1.85"
publish = true
exclude = ["examples/"]

[features]
default = ["png", "jpeg", "tga", "bmp", "svg", "hdr", "exr", "stl", "obj", "msh", "gltf", "fbx", "bvh", "ply", "csv", "numpy", "raw", "vtk", "xdmf", "exodus", "ensight", "tecplot", "cgns", "netcdf"]
png = ["dep:image"]
jpeg = ["dep:image"]
tga = ["dep:image"]
bmp = ["dep:image"]
svg = ["dep:resvg"]
hdr = ["dep:image"]
exr = ["dep:image"]
stl = ["dep:stl_io"]
obj = ["dep:tobj"]
msh = []
gltf = ["dep:gltf", "gltf/KHR_texture_transform", "gltf/extensions", "dep:serde_json"]
fbx = ["dep:fbxcel-dom", "dep:anyhow", "png"]
bvh = []
ply = []
csv = []
numpy = ["dep:flate2"]
raw = ["dep:serde", "dep:serde_json"]
vtk = ["dep:vtkio", "_scientific-common"]
xdmf = ["dep:hdf5", "dep:hdf5-sys", "_scientific-common"]
exodus = ["dep:hdf5", "dep:hdf5-sys", "_scientific-common"]
ensight = ["_scientific-common"]
tecplot = ["_scientific-common"]
cgns = ["dep:hdf5", "dep:hdf5-sys", "_scientific-common"]
netcdf = ["dep:netcdf-reader", "_scientific-common"]
# Plumbing every scientific loader compiles: the shared ReadError, the PVD
# time-series reader (which parses XML), and the internal Dataset model. Not a
# format, so it is not in all-formats and is not meant to be enabled directly:
# the format features above pull it in.
_scientific-common = ["dep:quick-xml"]
# Shared invariant checks and in-memory fixture builders for loader tests.
# Deliberately outside `all-formats`: it is test scaffolding, not a format.
testkit = []
all-formats = ["png", "jpeg", "tga", "bmp", "svg", "hdr", "exr", "stl", "obj", "msh", "gltf", "fbx", "bvh", "ply", "csv", "numpy", "raw", "vtk", "xdmf", "exodus", "ensight", "tecplot", "cgns", "netcdf"]

[dependencies]
anyhow = { version = "1", optional = true }
fbxcel-dom = { version = "0.0.10", optional = true }
glam = { version = "=0.30.10", features = ["bytemuck"] }
gltf = { version = "1", features = ["import", "KHR_materials_emissive_strength", "KHR_materials_pbrSpecularGlossiness"], optional = true }
hdf5 = { version = "0.8", optional = true }
hdf5-sys = { version = "0.8", features = ["static", "zlib"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr", "tga", "bmp"], optional = true }
flate2 = { version = "1", optional = true }
netcdf-reader = { version = "0.4", default-features = false, features = ["netcdf4"], optional = true }
quick-xml = { version = "0.36", optional = true }
resvg = { version = "0.45", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
stl_io = { version = "0.7", optional = true }
thiserror = "2.0"
tobj = { version = "4", optional = true }
vtkio = { version = "0.6", optional = true }

[[example]]
name = "probe-gltf"
path = "examples/probe_gltf.rs"
required-features = ["gltf"]

[[example]]
name = "probe-fbx-axis"
path = "examples/probe_fbx_axis.rs"
required-features = ["fbx"]

[[example]]
name = "probe-fbx-morph"
path = "examples/probe_fbx_morph.rs"
required-features = ["fbx"]

[[example]]
name = "probe-gltf-morph"
path = "examples/probe_gltf_morph.rs"
required-features = ["gltf"]

[[example]]
name = "probe-bvh"
path = "examples/probe_bvh.rs"
required-features = ["bvh"]

[[example]]
name = "probe-fbx-orientation"
path = "examples/probe_fbx_orientation.rs"
required-features = ["fbx"]

[[example]]
name = "probe-fbx-uv"
path = "examples/probe_fbx_uv.rs"
required-features = ["fbx"]

# The conformance tests are external consumers of this crate, so they only see
# `testkit` when it is enabled: run them with `cargo test --features testkit`.
# Declaring the requirement means cargo skips these targets when the feature is
# off, rather than failing to compile them.
[[test]]
name = "testkit_selfcheck"
required-features = ["testkit"]

[[test]]
name = "loader_obj"
required-features = ["testkit"]

[[test]]
name = "loader_stl"
required-features = ["testkit"]

[[test]]
name = "loader_ply"
required-features = ["testkit"]

[[test]]
name = "loader_csv"
required-features = ["testkit"]

[[test]]
name = "loader_vtk"
required-features = ["testkit"]

[[test]]
name = "loader_gltf"
required-features = ["testkit"]

[[test]]
name = "loader_svg"
required-features = ["testkit"]

[[test]]
name = "loader_numpy"
required-features = ["testkit"]

[[test]]
name = "loader_fbx"
required-features = ["testkit"]
