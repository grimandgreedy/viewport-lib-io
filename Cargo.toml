[package]
name = "viewport-lib-io"
version = "0.1.0"
edition = "2024"
description = "Optional IO helpers for viewport-lib"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib"

[features]
default = ["png", "hdr", "stl", "obj", "msh", "gltf", "fbx", "ply", "csv", "numpy", "raw"]
png = ["dep:image"]
hdr = ["dep:image"]
stl = ["dep:stl_io"]
obj = ["dep:tobj"]
msh = []
gltf = ["dep:gltf"]
fbx = ["dep:fbxcel-dom", "dep:anyhow", "png"]
ply = []
csv = []
numpy = ["dep:flate2"]
raw = ["dep:serde", "dep:serde_json"]
all-formats = ["png", "hdr", "stl", "obj", "msh", "gltf", "fbx", "ply", "csv", "numpy", "raw"]

[dependencies]
anyhow = { version = "1", optional = true }
fbxcel-dom = { version = "0.0.10", optional = true }
glam = { version = "=0.30.10", features = ["bytemuck"] }
gltf = { version = "1", features = ["import"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"], optional = true }
flate2 = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
stl_io = { version = "0.7", optional = true }
thiserror = "2.0"
tobj = { version = "4", optional = true }
viewport-lib = { path = "../viewport-lib" }
