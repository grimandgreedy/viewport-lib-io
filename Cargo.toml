[package]
name = "viewport-lib-io"
version = "0.8.0"
edition = "2024"
description = "File format loaders and exporters for viewport-lib"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib-io"
homepage = "https://github.com/grimandgreedy/viewport-lib-io"
documentation = "https://docs.rs/viewport-lib-io"
keywords = ["3d", "loader", "visualization", "viewport", "viewport-lib"]
categories = ["graphics", "parser-implementations", "filesystem"]
rust-version = "1.85"
publish = true
exclude = ["examples/", "tests/", ".github/", ".gitignore"]

[package.metadata.docs.rs]
features = ["all-formats"]

[features]
# No format is on by default: a consumer names the formats it reads, or takes
# `all-formats`. Each format pulls its own parser, and the HDF5 ones (`xdmf`,
# `exodus`, `cgns`) build the HDF5 C library with CMake.
default = []
png = ["dep:image"]
jpeg = ["dep:image"]
tga = ["dep:image"]
bmp = ["dep:image"]
svg = ["dep:resvg"]
hdr = ["dep:image"]
exr = ["dep:image"]
stl = ["dep:stl_io"]
obj = ["dep:tobj"]
msh = []
gltf = ["dep:gltf", "gltf/KHR_texture_transform", "gltf/KHR_materials_unlit", "gltf/KHR_materials_ior", "gltf/KHR_materials_specular", "gltf/KHR_lights_punctual", "gltf/extensions", "gltf/allow_empty_texture", "dep:serde_json"]
# KHR_draco_mesh_compression primitives in glTF, decoded at load. Needs Rust 1.88.
gltf-draco = ["gltf", "dep:draco-core"]
# EXT_meshopt_compression buffer views in glTF, decoded at load. Needs Rust 1.88.
gltf-meshopt = ["gltf", "dep:meshopt-pure"]
# KTX2 images (KHR_texture_basisu) in glTF, transcoded at load to the
# `GltfTextureTarget` the caller picks.
gltf-ktx2 = ["gltf", "dep:basisu"]
fbx = ["dep:fbxcel-dom", "dep:anyhow", "png"]
bvh = []
ply = []
csv = []
numpy = ["dep:flate2"]
raw = ["dep:serde", "dep:serde_json"]
vtk = ["dep:vtkio", "_scientific-common"]
xdmf = ["dep:hdf5", "dep:hdf5-sys", "_scientific-common"]
exodus = ["dep:hdf5", "dep:hdf5-sys", "_scientific-common"]
ensight = ["_scientific-common"]
tecplot = ["_scientific-common"]
cgns = ["dep:hdf5", "dep:hdf5-sys", "_scientific-common"]
netcdf = ["dep:netcdf-reader", "_scientific-common"]
# Plumbing every scientific loader compiles: the shared ReadError, the PVD
# time-series reader (which parses XML), and the internal Dataset model. Not a
# format, so it is not in all-formats and is not meant to be enabled directly:
# the format features above pull it in.
_scientific-common = ["dep:quick-xml"]
all-formats = ["png", "jpeg", "tga", "bmp", "svg", "hdr", "exr", "stl", "obj", "msh", "gltf", "gltf-draco", "gltf-meshopt", "gltf-ktx2", "fbx", "bvh", "ply", "csv", "numpy", "raw", "vtk", "xdmf", "exodus", "ensight", "tecplot", "cgns", "netcdf"]

[dev-dependencies]
# The shared checks and fixture builders, as a crate rather than a feature so a
# release build never compiles them. It depends back on this crate; cargo allows
# that cycle for a dev-dependency between packages.
viewport-lib-io-testkit = { path = "testkit" }
# The Draco and meshopt encoders build the compressed glTF fixtures.
draco-core = { version = "2.3", default-features = false, features = ["encoder", "decoder"] }
meshopt-pure = "1.3"

[dependencies]
anyhow = { version = "1", optional = true }
basisu = { version = "0.1", optional = true }
draco-core = { version = "2.3", optional = true, default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
fbxcel-dom = { version = "0.0.10", optional = true }
glam = { version = "=0.30.10", features = ["bytemuck"] }
gltf = { version = "1", features = ["import", "KHR_materials_emissive_strength", "KHR_materials_pbrSpecularGlossiness"], optional = true }
hdf5 = { version = "0.8", optional = true }
hdf5-sys = { version = "0.8", features = ["static", "zlib"], optional = true }
meshopt-pure = { version = "1.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr", "tga", "bmp"], optional = true }
flate2 = { version = "1", optional = true }
netcdf-reader = { version = "0.4", default-features = false, features = ["netcdf4"], optional = true }
quick-xml = { version = "0.36", optional = true }
resvg = { version = "0.45", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
stl_io = { version = "0.7", optional = true }
thiserror = "2.0"
tobj = { version = "4", optional = true }
viewport-lib-types = { version = "0.2", default-features = false }
# The Gaussian splat payload. Default features off: they turn on the plugin's
# `gpu` feature, which brings viewport-lib and wgpu back.
viewport-lib-plugins = { version = "0.1", default-features = false, features = ["item-types"] }
vtkio = { version = "0.6", optional = true }

[[example]]
name = "probe-gltf"
path = "examples/probe_gltf.rs"
required-features = ["gltf"]

[[example]]
name = "probe-fbx-axis"
path = "examples/probe_fbx_axis.rs"
required-features = ["fbx"]

[[example]]
name = "probe-fbx-morph"
path = "examples/probe_fbx_morph.rs"
required-features = ["fbx"]

[[example]]
name = "probe-gltf-morph"
path = "examples/probe_gltf_morph.rs"
required-features = ["gltf"]

[[example]]
name = "probe-bvh"
path = "examples/probe_bvh.rs"
required-features = ["bvh"]

[[example]]
name = "probe-fbx-orientation"
path = "examples/probe_fbx_orientation.rs"
required-features = ["fbx"]

[[example]]
name = "probe-fbx-uv"
path = "examples/probe_fbx_uv.rs"
required-features = ["fbx"]
